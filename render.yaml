# Render deployment — existing Node service for the Developer Community API
# and WebSocket, with persistent storage and health checks.
#
# Prerequisite: this repo on GitHub → Render → New Blueprint → pick repo.
services:
  - type: web
    name: tejas-portfolio
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://tejas-portfolio-hazel.vercel.app
      - key: DB_PATH
        value: /var/data/community.db
